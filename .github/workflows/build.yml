   name: build
   on:
     push:
       branches: [build]
   jobs:
     build:
       runs-on: windows-latest
       steps:
         - uses: actions/checkout@v4
         - uses: microsoft/setup-msbuild@v2
         - run: msbuild Osiris.sln /p:Configuration=Release /p:Platform=x86
         - uses: actions/upload-artifact@v4
           with:
             name: Osiris
             path: '**/Osiris.dll'
